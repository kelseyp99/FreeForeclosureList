<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leon County Tax Deed Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2em; }
        .report-scroll-container {
            max-width: 1700px;
            height: 1200px;
            overflow: auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
        }
        .sticky-title {
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 100;
            padding-bottom: 0.5em;
            border-bottom: 2px solid #eee;
        }
        .sticky-table-header th {
            position: sticky;
            top: 2.2em;
            background: #f4f4f4;
            z-index: 99;
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        tr:nth-child(even) { background: #fafafa; }
        .filter-note { color: #666; font-size: 0.95em; margin-bottom: 1em; }
    </style>
</head>
<body>
    <div class="report-scroll-container">
        <div class="sticky-title"><strong>Leon County Tax Deed Report</strong><br><span style="font-weight: normal; font-size: 0.95em;">Generated: 2025-11-27 21:11:23</span></div>
        <table>
            <thead class="sticky-table-header">
                <tr><th style="width:36px"><input type="checkbox" id="header-show-selected" title="Show Selected Only" style="transform: scale(1.3); cursor: pointer; vertical-align: middle;" /></th><th>Add Date</th><th>Address</th><th>Assessed Value</th><th>Case Number</th><th>Certificate Holder Name</th><th>City</th><th>Final Judgment</th><th>My Bid</th><th>Opening Bid</th><th>Parcel ID</th><th>Plaintiff Max Bid</th><th>Sale Date</th><th>Status</th><th>Zip</th></tr>
        </thead>
        <tbody>
        </tbody>
      </table>
    </div>
<script src="/sortable-table.js"></script>
</body>
</html>
